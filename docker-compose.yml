# CCTV Forensic Analyzer — full stack deployment.
#
#   docker compose up --build
#
# Copy .env.example to .env first and set a strong JWT_SECRET.

name: cctv-forensics

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctv_password}
      POSTGRES_DB: ${POSTGRES_DB:-cctv_forensics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctv_user} -d ${POSTGRES_DB:-cctv_forensics}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cctv_user}:${POSTGRES_PASSWORD:-cctv_password}@postgres:5432/${POSTGRES_DB:-cctv_forensics}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: '["http://localhost", "http://127.0.0.1"]'
    volumes:
      - evidence-storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--pool=solo", "--loglevel=INFO"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cctv_user}:${POSTGRES_PASSWORD:-cctv_password}@postgres:5432/${POSTGRES_DB:-cctv_forensics}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      STORAGE_PATH: /app/storage
    volumes:
      - evidence-storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  evidence-storage:
